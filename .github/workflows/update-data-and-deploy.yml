name: Refresh resilience data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "25 20 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install R package
        run: Rscript -e "install.packages('jsonlite', repos = 'https://cloud.r-project.org')"
      - name: Refresh OpenFEMA data
        run: Rscript scripts/update_fema_data.R
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_data/ website/data/
          git diff --cached --quiet || git commit -m "data: refresh OpenFEMA declarations"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
